name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build intake form
        run: pnpm --filter @workspace/intake-form build
        env:
          PORT: 3000
          BASE_PATH: /Patient-Intake-System-Womens-Better-Health-TymFlo/
          NODE_ENV: production

      - name: Build tutorial
        run: pnpm --filter @workspace/intake-form-tutorial build
        env:
          PORT: 3000
          BASE_PATH: /Patient-Intake-System-Womens-Better-Health-TymFlo/intake-form-tutorial/
          NODE_ENV: production

      - name: Merge tutorial into intake-form dist
        run: |
          mkdir -p artifacts/intake-form/dist/public/intake-form-tutorial
          cp -r artifacts/intake-form-tutorial/dist/public/. artifacts/intake-form/dist/public/intake-form-tutorial/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/intake-form/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
