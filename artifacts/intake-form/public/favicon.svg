<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#3d0e22"/>
  <!-- Starburst rays -->
  <g transform="translate(90,90)">
    <!-- 12 rays -->
    <ellipse rx="7" ry="32" transform="rotate(0)"   fill="#E8956D"/>
    <ellipse rx="7" ry="32" transform="rotate(30)"  fill="#E8956D"/>
    <ellipse rx="7" ry="32" transform="rotate(60)"  fill="#E8956D"/>
    <ellipse rx="7" ry="32" transform="rotate(90)"  fill="#E8956D"/>
    <ellipse rx="7" ry="32" transform="rotate(120)" fill="#E8956D"/>
    <ellipse rx="7" ry="32" transform="rotate(150)" fill="#E8956D"/>
    <!-- Outer ring -->
    <circle r="42" fill="#3d0e22"/>
    <!-- Main circle -->
    <circle r="34" fill="#E8956D"/>
    <!-- Inner dark ring -->
    <circle r="22" fill="#3d0e22"/>
    <!-- 4-pointed star in center -->
    <path d="M0,-17 C2,-6 6,-2 17,0 C6,2 2,6 0,17 C-2,6 -6,2 -17,0 C-6,-2 -2,-6 0,-17Z" fill="#E8956D"/>
  </g>
</svg>
